name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, one version failing cancels the other and hides half
      # the information.
      fail-fast: false
      matrix:
        # 3.10 is the floor the entry point enforces; 3.13 catches
        # deprecations. 3.10 is pinned to 22.04 because newer runner images
        # no longer carry it and setup-python fails outright.
        include:
          - { python: "3.10", os: ubuntu-22.04 }
          - { python: "3.13", os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # One script, run identically here and on a laptop. 1.0.0 shipped with
      # red CI because the checks lived here and were only partly reproduced
      # by hand before pushing; the one that was skipped found a real bug.
      # Keeping the logic in tools/check.sh means there is nothing to skip.
      - name: ./tools/check.sh
        run: ./tools/check.sh
